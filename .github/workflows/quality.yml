name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit Tests
        run: >
          dotnet test tests/Unit
          --no-build
          --configuration Release
          --logger "trx;LogFileName=unit-results.trx"
          /p:CollectCoverage=true
          /p:Threshold=80
          /p:ThresholdType=line
          /p:ThresholdStat=total
          /p:Exclude="[PlayTest.Core]*%2c[TestReportGenerator]*"

      - name: Integration Tests
        run: dotnet test tests/Integration --no-build --configuration Release --logger "trx;LogFileName=integration-results.trx"

      - name: Contract Tests
        run: dotnet test tests/Contract --no-build --configuration Release --logger "trx;LogFileName=contract-results.trx"

      - name: End-to-End Tests
        run: dotnet test tests/EndToEnd --no-build --configuration Release --logger "trx;LogFileName=e2e-results.trx"

      - name: Generate Test Reliability Report
        run: >
          dotnet run
          --project tools/TestReportGenerator
          --no-build
          --configuration Release
          --
          .
          --output TestResults/test-reliability-report.json

      - name: Upload Test Results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: test-results
          path: "**/TestResults/**"
