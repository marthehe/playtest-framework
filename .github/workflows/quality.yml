name: Quality Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Unit Tests
        run: >
          dotnet test tests/Unit
          --no-build
          --configuration Release
          --logger "trx;LogFileName=unit-results.trx"
          /p:CollectCoverage=true
          /p:Threshold=80
          /p:ThresholdType=line
          /p:ThresholdStat=total
          /p:Exclude="[PlayTest.Core]*%2c[TestReportGenerator]*"

      - name: Integration Tests
        run: dotnet test tests/Integration --no-build --configuration Release --logger "trx;LogFileName=integration-results.trx"

      - name: Contract Tests
        run: dotnet test tests/Contract --no-build --configuration Release --logger "trx;LogFileName=contract-results.trx"

      - name: End-to-End Tests
        run: dotnet test tests/EndToEnd --no-build --configuration Release --logger "trx;LogFileName=e2e-results.trx"

      - name: Download Historical Test Results
        if: always()
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: >
          ./tools/ci/Download-TestHistory.ps1
          -Repository "${{ github.repository }}"
          -Token $env:GITHUB_TOKEN
          -CurrentRunId ${{ github.run_id }}
          -MaxRuns 10
          -Destination ".test-history"

      - name: Generate Test Health Reports
        if: always()
        run: >
          dotnet run
          --project tools/TestReportGenerator
          --no-build
          --configuration Release
          --
          .
          --output TestResults/test-reliability-report.json
          --triage-output TestResults/test-failure-triage.json
          --summary-output TestResults/test-health-summary.md
          --labels tests/Unit/Reporting/Fixtures/labelled-failures.json
          --flakiness-threshold 0.10

      - name: Publish Test Health Summary
        if: always()
        shell: bash
        run: |
          if [ -f TestResults/test-health-summary.md ]; then
            cat TestResults/test-health-summary.md >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: test-results
          path: "**/TestResults/**"
